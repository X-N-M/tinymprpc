syntax = "proto3";

package mprpc;

message RpcHeader
{
    bytes service_name=1;
    bytes method_name=2;
    int64 deadline_unix_ms=3;
}

enum RpcStatusCode
{
    RPC_STATUS_OK=0;
    RPC_STATUS_BAD_REQUEST=1;
    RPC_STATUS_SERVICE_NOT_FOUND=2;
    RPC_STATUS_METHOD_NOT_FOUND=3;
    RPC_STATUS_REQUEST_PARSE_ERROR=4;
    RPC_STATUS_RESPONSE_SERIALIZE_ERROR=5;
    RPC_STATUS_INTERNAL_ERROR=6;
    RPC_STATUS_DEADLINE_EXCEEDED=7;
}

message RpcResponseMeta
{
    RpcStatusCode rpc_status_code = 1;
    string error_text=2;
}